server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Public site (Fase 5 G1): only its own files and the API for the prices.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https: http://localhost:8000; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location / {
    try_files $uri $uri/ =404;
  }

  location ~* \.(css|js|svg)$ {
    expires 1h;
    add_header Cache-Control "public" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
}
